name: GroupPay
options:
  bundleIdPrefix: com.itsfloppyhat
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "4"
targets:
  GroupPay:
    type: application
    platform: iOS
    sources:
      - GroupPay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itsfloppyhat.GroupPay
        PRODUCT_NAME: GroupPay
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Group Pay
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: FYWW2S89N3
        CODE_SIGN_ENTITLEMENTS: GroupPay/GroupPay.entitlements
        INFOPLIST_KEY_NSCameraUsageDescription: Scan receipts to split restaurant bills and groceries with your group.
    info:
      path: GroupPay/Info.plist
      properties:
        GroupPayCardServiceURL: https://group-pay-sandbox-d3md3qdhcq-uc.a.run.app
        CKSharingSupported: true
        UIBackgroundModes: [fetch, remote-notification]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
schemes:
  GroupPay:
    build:
      targets:
        GroupPay: all
    run:
      config: Debug
    archive:
      config: Release
